[project]
name = "alphax_cit"
authors = [{name = "Neotec Integrated Solutions", email = "support@neotec.sa"}]
description = "AlphaX CIT — Cash in Transit operations, custody, fleet and billing for ERPNext v15"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
